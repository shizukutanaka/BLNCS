version: '3.8'

services:
  blncs:
    build: .
    container_name: blncs-main
    restart: unless-stopped
    environment:
      - BLNCS_ENVIRONMENT=production
      - BLNCS_LOG_LEVEL=INFO
    volumes:
      - blncs_data:/home/blncs/.blncs/data
      - blncs_logs:/home/blncs/.blncs/logs
      - ./config:/home/blncs/.blncs/config:ro
    ports:
      - "8080:8080"
    networks:
      - blncs-network
    healthcheck:
      test: ["CMD", "python", "-m", "blncs.cli.main", "health", "--quick"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add monitoring
  monitoring:
    image: prom/prometheus:latest
    container_name: blncs-monitoring
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - blncs-network
    profiles:
      - monitoring

volumes:
  blncs_data:
    driver: local
  blncs_logs:
    driver: local
  prometheus_data:
    driver: local

networks:
  blncs-network:
    driver: bridge