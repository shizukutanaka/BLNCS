# BLNCS Disaster Recovery Configuration
# Comprehensive backup and recovery settings

disaster_recovery:
  enabled: true
  backup_root: "/var/backups/blncs"
  temp_dir: "/tmp/blncs_dr"
  
  # Global settings
  default_retention_days: 30
  compression_level: 6
  encryption_enabled: false
  parallel_operations: 2
  
  # Scheduler settings
  scheduler:
    enabled: true
    check_interval: 3600  # seconds (1 hour)
    auto_cleanup: true
    
  # Storage backends configuration
  storage_backends:
    local:
      enabled: true
      path: "/var/backups/blncs"
      
    s3:
      enabled: false
      bucket: "blncs-backups"
      region: "us-east-1"
      prefix: "blncs-backups/"
      storage_class: "STANDARD_IA"  # STANDARD, REDUCED_REDUNDANCY, STANDARD_IA, GLACIER
      
    azure:
      enabled: false
      container: "blncs-backups"
      account_name: ""
      account_key: ""
      
    gcp:
      enabled: false
      bucket: "blncs-backups"
      project_id: ""
      
  # Backup sets configuration
  backup_sets:
    lightning:
      enabled: true
      description: "Lightning Network node data and configuration"
      sources:
        - "/home/lightning/.lnd"
        - "/home/lightning/.lightning"
        - "/opt/lnd/data"
        - "/opt/cln/data"
      full_backup_interval: 86400  # seconds (1 day)
      compression: true
      encryption: false
      retention_policy:
        daily: 30
        weekly: 12
        monthly: 12
      tags:
        category: "lightning"
        criticality: "high"
        
    application:
      enabled: true
      description: "BLNCS application data and configuration"
      sources:
        - "/opt/blncs/data"
        - "/opt/blncs/config"
        - "/etc/blncs"
      full_backup_interval: 604800  # seconds (7 days)
      compression: true
      encryption: false
      retention_policy:
        daily: 7
        weekly: 4
        monthly: 6
      tags:
        category: "application"
        criticality: "high"
        
    database:
      enabled: true
      description: "Database backups with point-in-time recovery"
      sources:
        - "/var/lib/postgresql/data"
        - "/var/lib/sqlite/blncs.db"
      full_backup_interval: 86400  # seconds (1 day)
      compression: true
      encryption: true
      retention_policy:
        daily: 30
        weekly: 12
        monthly: 12
      pre_backup_scripts:
        - "/opt/blncs/scripts/pre_db_backup.sh"
      post_backup_scripts:
        - "/opt/blncs/scripts/post_db_backup.sh"
      tags:
        category: "database"
        criticality: "critical"
        
    system:
      enabled: true
      description: "System configuration and logs"
      sources:
        - "/etc/blncs"
        - "/var/log/blncs"
        - "/opt/blncs/logs"
      full_backup_interval: 2592000  # seconds (30 days)
      compression: true
      encryption: false
      retention_policy:
        daily: 3
        weekly: 4
        monthly: 12
      tags:
        category: "system"
        criticality: "medium"
        
    security:
      enabled: true
      description: "Security certificates and keys"
      sources:
        - "/opt/blncs/certs"
        - "/opt/blncs/keys"
        - "/etc/ssl/blncs"
      full_backup_interval: 604800  # seconds (7 days)
      compression: true
      encryption: true
      retention_policy:
        daily: 30
        weekly: 12
        monthly: 24
      tags:
        category: "security"
        criticality: "critical"

# Recovery configuration
recovery:
  # Default recovery settings
  default_mode: "latest"
  verify_integrity: true
  parallel_restore: true
  
  # Recovery destinations
  restore_paths:
    lightning: "/tmp/blncs_recovery/lightning"
    application: "/tmp/blncs_recovery/application"
    database: "/tmp/blncs_recovery/database"
    system: "/tmp/blncs_recovery/system"
    security: "/tmp/blncs_recovery/security"
    
  # Recovery scripts
  scripts:
    pre_recovery:
      - "/opt/blncs/scripts/pre_recovery.sh"
      - "/opt/blncs/scripts/stop_services.sh"
      
    post_recovery:
      - "/opt/blncs/scripts/post_recovery.sh"
      - "/opt/blncs/scripts/start_services.sh"
      - "/opt/blncs/scripts/verify_recovery.sh"
      
  # Point-in-time recovery settings
  point_in_time:
    granularity: 3600  # seconds (1 hour)
    max_age_days: 30
    
# Monitoring and alerting
monitoring:
  enabled: true
  
  # Backup monitoring
  backup_alerts:
    failed_backup:
      enabled: true
      threshold: 1  # number of failures
      notification_channels: ["email", "slack"]
      
    backup_duration:
      enabled: true
      threshold: 7200  # seconds (2 hours)
      notification_channels: ["slack"]
      
    backup_size_anomaly:
      enabled: true
      deviation_threshold: 0.5  # 50% size change
      notification_channels: ["slack"]
      
    storage_usage:
      enabled: true
      threshold: 0.9  # 90% of available space
      notification_channels: ["email", "slack"]
      
  # Recovery monitoring
  recovery_alerts:
    recovery_failure:
      enabled: true
      notification_channels: ["email", "slack", "pagerduty"]
      
    integrity_check_failure:
      enabled: true
      notification_channels: ["email", "slack"]

# Testing and validation
testing:
  # Backup validation
  validation:
    enabled: true
    frequency: "weekly"
    test_restore: true
    integrity_check: true
    
  # Disaster recovery drills
  drills:
    enabled: true
    frequency: "monthly"
    scenarios:
      - "complete_system_failure"
      - "database_corruption"
      - "lightning_node_failure"
      - "partial_data_loss"
    notifications:
      - "ops-team@company.com"
      - "#blncs-ops"

# Compliance and audit
compliance:
  # Audit logging
  audit:
    enabled: true
    log_all_operations: true
    retain_logs_days: 365
    
  # Compliance frameworks
  frameworks:
    pci_dss:
      enabled: false
      data_retention_years: 1
      encryption_required: true
      
    gdpr:
      enabled: false
      data_retention_years: 3
      anonymization_required: true
      
    sox:
      enabled: false
      immutable_backups: true
      retention_years: 7

# Performance optimization
performance:
  # Backup performance
  backup:
    parallel_streams: 4
    compression_threads: 2
    bandwidth_limit: "100M"  # 100 Mbps
    io_priority: "best-effort"
    
  # Storage optimization
  storage:
    deduplication: false
    compression_algorithm: "gzip"  # gzip, lz4, zstd
    block_size: "1M"
    
  # Network optimization
  network:
    tcp_window_size: "64K"
    connection_timeout: 30
    retry_attempts: 3
    retry_delay: 5

# Integration settings
integration:
  # Monitoring integration
  prometheus:
    enabled: true
    metrics_port: 8001
    
  # Logging integration
  syslog:
    enabled: true
    facility: "local0"
    
  # Notification integration
  notifications:
    email:
      enabled: true
      smtp_server: "localhost"
      smtp_port: 587
      from_address: "backups@blncs.local"
      
    slack:
      enabled: false
      webhook_url: ""
      channel: "#blncs-backups"
      
    pagerduty:
      enabled: false
      integration_key: ""