# BLNCS Configuration Example
# Copy this file to config.yaml and modify as needed

# System Configuration
system:
  name: "BLNCS"
  environment: "development"  # development, testing, production
  log_level: "info"          # debug, info, warning, error, critical
  data_dir: "./data"         # Directory for storing data
  backup_dir: "./backups"    # Directory for backups

# Lightning Network Configuration
lightning:
  # Node connection settings
  host: "localhost"
  port: 8080                 # REST API port
  grpc_port: 10009          # gRPC port
  network: "testnet"         # mainnet, testnet, regtest
  
  # Authentication
  cert_path: "~/.lnd/tls.cert"
  macaroon_path: "~/.lnd/data/chain/bitcoin/testnet/readonly.macaroon"
  
  # Timeouts and retries
  timeout: 30               # Request timeout in seconds
  connect_timeout: 10       # Connection timeout in seconds
  max_retries: 3           # Maximum retry attempts
  
  # Channel management
  auto_channel_backup: true
  channel_fee_rate: 1000   # Default fee rate for channels (msat/sat)
  
# Features Configuration
features:
  enable_cache: true        # Enable caching for better performance
  cache_ttl: 300           # Cache TTL in seconds
  
  enable_history: true     # Enable transaction history
  max_history_entries: 1000 # Maximum history entries to keep
  
  enable_monitoring: true  # Enable system monitoring
  monitoring_interval: 60 # Monitoring check interval in seconds
  
  enable_auto_backup: false # Enable automatic backups
  backup_interval: 3600    # Backup interval in seconds
  
  enable_webhooks: false   # Enable webhook notifications
  webhook_url: ""          # Webhook endpoint URL

# Security Configuration
security:
  enable_api_auth: false   # Enable API authentication
  api_key: ""             # API key for authentication
  
  enable_ip_whitelist: false # Enable IP whitelisting
  allowed_ips: []         # List of allowed IP addresses
  
  enable_rate_limiting: true # Enable rate limiting
  rate_limit: 100         # Requests per minute limit

# Performance Configuration  
performance:
  enable_performance_monitoring: true
  performance_log_interval: 300  # Log performance metrics every 5 minutes
  
  # Connection pooling
  max_connections: 10
  connection_timeout: 5
  
  # Caching
  enable_request_cache: true
  request_cache_size: 1000
  
# Logging Configuration
logging:
  file_logging: true
  log_file: "logs/blncs.log"
  max_log_size: "10MB"
  backup_count: 5
  
  # Log levels by component
  components:
    lightning: "info"
    core: "info"
    api: "info"
    cli: "info"

# Development Configuration (only for development environment)
development:
  debug_mode: true
  mock_lightning_node: true  # Use mock data when no real node available
  enable_test_endpoints: true
  
# Production Configuration (only for production environment)
production:
  debug_mode: false
  enable_metrics: true
  metrics_port: 9090