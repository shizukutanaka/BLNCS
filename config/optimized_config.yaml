# BLNCS Optimized Configuration
# Performance-tuned settings for production use

# Lightning Network Settings
lightning:
  host: localhost
  port: 8080
  network: mainnet
  timeout: 5               # Reduced for faster failure detection
  connect_timeout: 2       # Faster connection attempts
  max_retry_attempts: 3    # Balanced retry strategy
  retry_interval: 10       # Quick retry for transient failures
  auto_retry: true
  
  # REST API Settings
  rest_port: 8080
  rest_timeout: 5
  
  # Authentication
  macaroon_path: ~/.lnd/data/chain/bitcoin/mainnet/readonly.macaroon
  cert_path: ~/.lnd/tls.cert

# Performance Settings
performance:
  # Connection pooling
  pool_connections: 20     # Increased for concurrent operations
  pool_maxsize: 40         # Double the connections for burst traffic
  max_retries: 3           
  backoff_factor: 1.5      # Exponential backoff
  
  # Caching
  cache_enabled: true
  cache_ttl: 300           # 5 minutes default
  cache_max_size: 1000     # Maximum cached items
  
  # Monitoring
  monitoring_enabled: true
  collection_interval: 30   # Collect metrics every 30 seconds
  max_history: 10000       # Store more history for analysis
  auto_tune: true          # Enable automatic performance tuning
  
  # Request optimization
  connection_timeout: 2     # Fast fail for dead connections
  read_timeout: 10         # Reasonable read timeout
  batch_size: 50           # Batch operations for efficiency
  parallel_requests: 10    # Concurrent request limit

# System Settings
system:
  data_dir: ./data
  backup_dir: ./backups
  log_dir: ./logs
  
  # Resource limits
  max_memory_mb: 512       # Memory limit for the application
  max_threads: 50          # Thread pool size
  
  # Cleanup
  cleanup_interval: 3600   # Cleanup every hour
  max_log_size_mb: 100     # Rotate logs at 100MB
  max_backup_age_days: 30  # Keep backups for 30 days

# Monitoring Settings
monitor:
  enabled: true
  interval: 60             # Check every minute
  alert_threshold: 80      # Alert at 80% resource usage
  
  # Lightning-specific monitoring
  lightning_enabled: true
  lightning_interval: 60
  channel_balance_min: 20  # Alert if channel balance < 20%
  channel_balance_max: 80  # Alert if channel balance > 80%
  node_uptime_min: 95      # Alert if uptime < 95%
  channel_inactive_hours: 48  # Alert after 2 days of inactivity

# Recovery Settings
recovery:
  max_retries: 5           # More retries for critical operations
  retry_delay: 1.0         # Start with 1 second delay
  exponential_backoff: true
  timeout: 600             # 10 minute timeout for recovery
  
  # Circuit breaker
  failure_threshold: 5     # Open circuit after 5 failures
  recovery_timeout: 60     # Try recovery after 1 minute
  half_open_requests: 3    # Test with 3 requests in half-open state

# Channel Management
channels:
  auto_rebalance: true
  rebalance_threshold: 30  # Rebalance if balance < 30% or > 70%
  min_channel_size: 100000 # Minimum channel size (sats)
  max_channel_size: 10000000  # Maximum channel size (sats)
  
  # Fee settings
  base_fee: 1              # Base fee in millisats
  fee_rate: 1              # Fee rate in millionths
  time_lock_delta: 40      # CLTV delta

# Security Settings
security:
  enable_encryption: true
  api_key_required: false  # Set to true in production
  rate_limit: 100          # Requests per minute
  allowed_ips: []          # Empty = allow all
  
  # SSL/TLS
  verify_ssl: false        # Set to true with valid certificates
  ssl_cert_path: null
  ssl_key_path: null

# Backup Settings
backup:
  enabled: true
  interval: 86400          # Daily backups
  max_backups: 30          # Keep 30 days of backups
  retention_days: 30
  
  # Backup types
  backup_channels: true
  backup_config: true
  backup_data: true
  
  # Compression
  compress: true
  compression_level: 6     # 1-9, higher = better compression

# API Settings
api:
  enabled: false           # Enable if API server needed
  host: 0.0.0.0
  port: 5000
  debug: false
  
  # Rate limiting
  rate_limit_enabled: true
  rate_limit_per_minute: 60
  
  # CORS
  cors_enabled: false
  cors_origins: ["*"]

# Logging Settings
logging:
  level: INFO              # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s|%(levelname)s|%(name)s|%(message)s"
  
  # File logging
  file_enabled: true
  file_path: ./logs/blncs.log
  file_rotation: daily
  file_retention_days: 30
  
  # Console logging
  console_enabled: true
  console_level: INFO
  
  # Performance logging
  log_performance: true
  performance_interval: 300  # Log performance every 5 minutes

# Development Settings (disable in production)
development:
  debug_mode: false
  mock_lightning: false    # Use mock Lightning client
  skip_ssl_verify: true    # Skip SSL verification
  verbose_errors: false    # Show detailed error messages