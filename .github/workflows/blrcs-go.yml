name: blrcs Go CI

on:
  push:
    branches: [main]
    paths:
      - 'blrcs/**'
  pull_request:
    branches: [main]
    paths:
      - 'blrcs/**'

permissions:
  contents: read

defaults:
  run:
    working-directory: blrcs

jobs:
  test:
    name: Test (${{ matrix.os }} / Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.22', '1.23']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: blrcs/go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (race)
        run: go test -race -count=1 ./...

      - name: Fuzz smoke (10s each)
        if: runner.os == 'Linux'
        run: |
          for target in $(grep -h '^func Fuzz' fuzz/fuzz_test.go | sed 's/func \(Fuzz[A-Za-z]*\).*/\1/'); do
            echo "Fuzzing $target for 10s…"
            go test -run='^$' -fuzz="^${target}$" -fuzztime=10s ./fuzz/
          done

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: blrcs/go.sum

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: blrcs
