name: Production CI/CD Pipeline

on:
  push:
    branches: [main, production]
    tags:
      - 'v*'
  pull_request:
    branches: [main, production]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # The quality baseline (ci/quality-baseline.json) was frozen under
  # Python 3.12, and finding counts -- mypy's in particular -- shift with
  # the interpreter version even when the code and tool versions are
  # identical (measured: Python 3.11 reports a few extra mypy errors on
  # this tree). The code-quality job below is the only consumer of this
  # variable in this workflow, and it must run the baseline's Python.
  # See docs/QUALITY_GATES.md ("Measurement environment").
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '18'

jobs:
  # ===== Code Quality =====
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/pypoetry
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install black isort safety pylint
          # The three baseline-gated tools are pinned to the exact
          # versions the baseline in ci/quality-baseline.json was frozen
          # with (see "tool_versions" there). Finding counts are
          # tool-version sensitive, so an unpinned "latest" install would
          # drift the gate red on a future tool release with no code
          # change. The pins satisfy the >= floors in
          # requirements-dev.txt, so the installs below keep them.
          pip install flake8==7.5.0 mypy==2.4.1 bandit==1.9.4
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Black formatter
        run: black --check blncs/

      - name: Run isort
        run: isort --check-only blncs/

      # Baseline (ratchet) gates: flake8 / mypy / bandit still run with the
      # exact same tool arguments as before, but their findings are compared
      # against the frozen per-category baseline in ci/quality-baseline.json.
      # Any new finding fails the job; reductions pass and print a notice to
      # ratchet the baseline down. See docs/QUALITY_GATES.md.
      - name: Run Flake8 (baseline gate)
        run: python scripts/quality_gate.py flake8

      - name: Run Pylint
        run: pylint blncs/ --fail-under=8.0

      - name: Run MyPy type checking (baseline gate)
        run: python scripts/quality_gate.py mypy

      - name: Run Bandit security linter (baseline gate)
        run: python scripts/quality_gate.py bandit

      - name: Check dependency vulnerabilities
        run: safety check --json

  # ===== Testing =====
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev python3-dev

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest pytest-cov pytest-asyncio pytest-mock pytest-benchmark

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --cov=blncs --cov-report=xml --cov-report=html

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
        run: |
          if [ -d tests/integration ]; then
            pytest tests/integration/ -v --cov=blncs --cov-append --cov-report=xml
          else
            echo "tests/integration/ does not exist; skipping integration tests"
          fi

      - name: Run performance tests
        run: |
          if [ -d tests/performance ]; then
            pytest tests/performance/ -v --benchmark-only --benchmark-autosave
          else
            echo "tests/performance/ does not exist; skipping performance tests"
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.python-version }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            htmlcov/
            .benchmarks/

  # ===== Security Scanning =====
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Snyk security scan
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v3

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ===== Build Docker Images =====
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [code-quality, test, security]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute sha tag prefix
        id: sha-prefix
        shell: bash
        run: |
          # docker/metadata-action derives its {{branch}} expansion from
          # the workflow ref (GITHUB_REF): the branch name for
          # refs/heads/* and an empty string for every other ref. Mirror
          # exactly that test here: branch refs keep the "<branch>-"
          # prefix, every other ref (pull_request refs/pull/*, tag
          # refs/tags/*, ...) falls back to the action's default "sha-"
          # prefix, so the sha tag can never become the invalid "-<sha>".
          #
          # Do NOT key this off github.ref_type: that context describes
          # the ref the workflow *run* is associated with and is only
          # ever "branch" or "tag" -- for pull_request runs it is
          # "branch" (the run belongs to the PR head branch) even though
          # GITHUB_REF is refs/pull/*. A previous fix gated two type=sha
          # lines on ref_type and so enabled the branch-prefixed line on
          # PRs, reproducing the invalid "-<sha>" tag it meant to fix.
          #
          # The branch name is sanitized the same way the action
          # sanitizes the final tag (Meta.sanitizeTag replaces runs of
          # [^a-zA-Z0-9._-] with '-'), so the value written to the output
          # is already a plain literal string -- no template syntax --
          # when the metadata action receives it as the prefix.
          if [[ "$GITHUB_REF" == refs/heads/* ]]; then
            branch="${GITHUB_REF#refs/heads/}"
            branch="$(printf '%s' "$branch" | sed -E 's/[^a-zA-Z0-9._-]+/-/g')"
            echo "prefix=${branch}-" >> "$GITHUB_OUTPUT"
          else
            echo "prefix=sha-" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The sha tag's prefix is the literal string computed by the
          # "Compute sha tag prefix" step above ("<branch>-" on branch
          # refs, "sha-" otherwise). The previous prefix={{branch}}-
          # expanded to an empty string on non-branch refs, producing
          # the invalid tag "-<sha>" and failing the build with
          # "invalid reference format".
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=${{ steps.sha-prefix.outputs.prefix }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      - name: Compute Trivy image reference
        id: trivy-ref
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          # The image reference scanned below must be the reference that
          # was actually pushed: "<registry>/<image>:<meta version>" with
          # the image name lowercased. env.IMAGE_NAME is
          # ${{ github.repository }} verbatim and so keeps the uppercase
          # "BLNCS"; Docker references require a lowercase repository, and
          # docker/metadata-action lowercases the names it generates
          # (Meta.sanitizeImageName), which is why the pushed tags are
          # "ghcr.io/shizukutanaka/blncs:..." while a reference hand-built
          # from env.IMAGE_NAME is ".../BLNCS:..." and Trivy aborted with
          # "could not parse reference" before scanning anything.
          image="$(printf '%s' "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')"
          echo "ref=${image}:${{ steps.meta.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Run Trivy on Docker image
        # Scan only when the build step actually pushed the image (the
        # same condition as its push: input). On pull_request nothing is
        # pushed and the multi-platform build is not loaded into the
        # local daemon either, so there is no image for Trivy to scan;
        # running it there could only fail. The scan therefore runs on
        # push / workflow_dispatch / tag events, against the pushed tag.
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.trivy-ref.outputs.ref }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ===== Deploy to Staging =====
  # Deployment is opt-in. BLNCS is provided as software only: the
  # project does not operate (or pay for) AWS infrastructure, so the
  # deploy jobs below must not run -- and fail on missing AWS
  # credentials -- on every push to main. They run only when the
  # repository variable ENABLE_DEPLOY is set to 'true'. To deploy to
  # your own AWS account: Settings -> Secrets and variables ->
  # Actions -> Variables tab -> New repository variable, name
  # ENABLE_DEPLOY, value true; and configure the AWS / Slack secrets
  # referenced by these jobs under the Secrets tab of the same page.
  # Without the variable, deploy-staging, performance-test,
  # deploy-production and rollback are skipped and the pipeline
  # finishes green on the build. See docs/QUALITY_GATES.md.
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: vars.ENABLE_DEPLOY == 'true' && github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.blncs.org

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name blncs-staging --region us-west-2

      - name: Deploy to Kubernetes
        run: |
          helm upgrade --install blncs-staging ./helm/blncs \
            --namespace staging \
            --create-namespace \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ github.sha }} \
            --set environment=staging \
            --wait \
            --timeout 10m

      - name: Run smoke tests
        run: |
          kubectl run smoke-test --image=curlimages/curl:latest --rm -i --restart=Never -- \
            curl -f https://staging.blncs.org/health

      - name: Notify Slack
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Staging deployment ${{ job.status }}'
        env:
          # action-slack v3 has no webhook_url input; the webhook URL
          # is passed via this environment variable (see its README).
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ===== Performance Testing =====
  performance-test:
    name: Performance Testing
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: vars.ENABLE_DEPLOY == 'true' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run k6 performance tests
        uses: grafana/k6-action@v0.3.0
        with:
          filename: tests/k6/performance.js
          flags: --out cloud
        env:
          K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}

      - name: Run Artillery load tests
        run: |
          npm install -g artillery
          artillery run tests/artillery/load-test.yml --output report.json

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: |
            report.json
            *.html

  # ===== Deploy to Production =====
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging, performance-test]
    if: vars.ENABLE_DEPLOY == 'true' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://blncs.org

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: us-east-1

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name blncs-production --region us-east-1

      - name: Create backup
        run: |
          kubectl create job backup-$(date +%Y%m%d-%H%M%S) \
            --from=cronjob/database-backup \
            --namespace production

      - name: Blue-Green Deployment
        run: |
          # Deploy to green environment
          helm upgrade --install blncs-green ./helm/blncs \
            --namespace production \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ github.ref_name }} \
            --set environment=production \
            --set bluegreen.productionSlot=green \
            --wait \
            --timeout 15m

          # Run health checks
          kubectl run health-check --image=curlimages/curl:latest --rm -i --restart=Never -- \
            curl -f https://green.blncs.org/health

          # Switch traffic to green
          kubectl patch service blncs-service -n production \
            -p '{"spec":{"selector":{"slot":"green"}}}'

          # Wait for traffic switch
          sleep 60

          # Delete blue deployment
          helm delete blncs-blue --namespace production || true

      - name: Run production smoke tests
        run: |
          ./scripts/production-smoke-tests.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*
            CHANGELOG.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update documentation
        run: |
          ./scripts/update-docs.sh ${{ github.ref_name }}

      - name: Notify team
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Production deployment ${{ job.status }}
            Version: ${{ github.ref_name }}
            Deployed by: ${{ github.actor }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          # action-slack v3 has no webhook_url input; the webhook URL
          # is passed via this environment variable (see its README).
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ===== Rollback =====
  rollback:
    name: Rollback Production
    runs-on: ubuntu-latest
    if: vars.ENABLE_DEPLOY == 'true' && failure() && needs.deploy-production.result == 'failure'
    needs: deploy-production
    environment:
      name: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: us-east-1

      - name: Rollback deployment
        run: |
          aws eks update-kubeconfig --name blncs-production --region us-east-1
          kubectl rollout undo deployment/blncs-app -n production
          kubectl rollout status deployment/blncs-app -n production

      - name: Notify team of rollback
        uses: 8398a7/action-slack@v3
        with:
          status: 'warning'
          text: 'Production deployment rolled back!'
        env:
          # action-slack v3 has no webhook_url input; the webhook URL
          # is passed via this environment variable (see its README).
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
