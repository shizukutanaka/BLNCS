version: 2
# The BLRCS Go module moved to its own repository (shizukutanaka/blrcs);
# this file now covers only the Python project at the root and the
# GitHub Actions used by the workflows.
updates:
  # --- Python project (repository root) ---
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # --- GitHub Actions used by the workflows (resolved from the root) ---
  # The allow/automerge keys below are preserved verbatim from PR #7.
  - package-ecosystem: "github-actions"
    directory: "/"
    allow:
      - dependency-type: "direct"
    automerge:
      - dependency-type: "direct"
    schedule:
      interval: "weekly"
