apiVersion: v1
kind: Namespace
metadata:
  name: blncs-production

---
# ConfigMap for application configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: blncs-config
  namespace: blncs-production
data:
  app.yaml: |
    environment: production
    debug: false
    log_level: INFO

    database:
      host: postgres-service.blncs-production.svc.cluster.local
      port: 5432
      name: blncs_prod
      ssl_mode: require
      pool_size: 20
      max_overflow: 40

    redis:
      host: redis-service.blncs-production.svc.cluster.local
      port: 6379
      db: 0
      pool_size: 50

    lightning:
      network: mainnet
      implementation: lnd
      max_channels: 100
      min_channel_size: 100000
      max_channel_size: 16777215

    security:
      jwt_secret: ${JWT_SECRET}
      encryption_key: ${ENCRYPTION_KEY}
      tls_enabled: true
      audit_logging: true

    monitoring:
      prometheus_enabled: true
      grafana_enabled: true
      elasticsearch_enabled: true
      jaeger_enabled: true

---
# Secret for sensitive data
apiVersion: v1
kind: Secret
metadata:
  name: blncs-secrets
  namespace: blncs-production
type: Opaque
stringData:
  jwt-secret: "your-super-secret-jwt-key-here"
  encryption-key: "your-256-bit-encryption-key-here"
  database-password: "secure-database-password"
  redis-password: "secure-redis-password"
  lnd-macaroon: "hex-encoded-macaroon-here"
  tls-cert: |
    -----BEGIN CERTIFICATE-----
    MIIDXTCCAkWgAwIBAgIJAKl...
    -----END CERTIFICATE-----
  tls-key: |
    -----BEGIN PRIVATE KEY-----
    MIIEvQIBADANBgkqhkiG9w0B...
    -----END PRIVATE KEY-----

---
# PostgreSQL StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: blncs-production
spec:
  serviceName: postgres-service
  replicas: 3
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: blncs_prod
        - name: POSTGRES_USER
          value: blncs_admin
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: blncs-secrets
              key: database-password
        - name: POSTGRES_REPLICATION_MODE
          value: master
        - name: POSTGRES_REPLICATION_USER
          value: replicator
        - name: POSTGRES_REPLICATION_PASSWORD
          valueFrom:
            secretKeyRef:
              name: blncs-secrets
              key: database-password
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        - name: postgres-config
          mountPath: /etc/postgresql
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
          limits:
            memory: "4Gi"
            cpu: "2"
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - blncs_admin
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - blncs_admin
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: postgres-config
        configMap:
          name: postgres-config
  volumeClaimTemplates:
  - metadata:
      name: postgres-storage
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 100Gi

---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: blncs-production
spec:
  selector:
    app: postgres
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432

---
# Redis StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: blncs-production
spec:
  serviceName: redis-service
  replicas: 3
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        command:
        - redis-server
        - /etc/redis/redis.conf
        ports:
        - containerPort: 6379
          name: redis
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: blncs-secrets
              key: redis-password
        volumeMounts:
        - name: redis-storage
          mountPath: /data
        - name: redis-config
          mountPath: /etc/redis
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1"
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: redis-config
        configMap:
          name: redis-config
  volumeClaimTemplates:
  - metadata:
      name: redis-storage
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 20Gi

---
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: blncs-production
spec:
  selector:
    app: redis
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379

---
# BLNCS Main Application Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blncs-app
  namespace: blncs-production
spec:
  replicas: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  selector:
    matchLabels:
      app: blncs
      tier: backend
  template:
    metadata:
      labels:
        app: blncs
        tier: backend
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: blncs-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: blncs
        image: blncs/production:v1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        - containerPort: 50051
          name: grpc
        - containerPort: 9090
          name: metrics
        env:
        - name: ENVIRONMENT
          value: production
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: blncs-secrets
              key: jwt-secret
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: blncs-secrets
              key: encryption-key
        - name: DATABASE_URL
          value: postgresql://blncs_admin:$(DATABASE_PASSWORD)@postgres-service:5432/blncs_prod?sslmode=require
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: blncs-secrets
              key: database-password
        - name: REDIS_URL
          value: redis://:$(REDIS_PASSWORD)@redis-service:6379/0
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: blncs-secrets
              key: redis-password
        - name: LND_MACAROON
          valueFrom:
            secretKeyRef:
              name: blncs-secrets
              key: lnd-macaroon
        volumeMounts:
        - name: config
          mountPath: /app/config
        - name: tls
          mountPath: /app/tls
          readOnly: true
        - name: logs
          mountPath: /app/logs
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /startup
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
      volumes:
      - name: config
        configMap:
          name: blncs-config
      - name: tls
        secret:
          secretName: blncs-secrets
          items:
          - key: tls-cert
            path: server.crt
          - key: tls-key
            path: server.key
      - name: logs
        emptyDir: {}

---
# Lightning Node Deployment
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lightning-node
  namespace: blncs-production
spec:
  serviceName: lightning-service
  replicas: 2
  selector:
    matchLabels:
      app: lightning
  template:
    metadata:
      labels:
        app: lightning
    spec:
      containers:
      - name: lnd
        image: lightninglabs/lnd:v0.17.0-beta
        ports:
        - containerPort: 9735
          name: p2p
        - containerPort: 10009
          name: rpc
        - containerPort: 8080
          name: rest
        env:
        - name: NETWORK
          value: mainnet
        volumeMounts:
        - name: lnd-data
          mountPath: /root/.lnd
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
          limits:
            memory: "4Gi"
            cpu: "2"
  volumeClaimTemplates:
  - metadata:
      name: lnd-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 500Gi

---
# Lightning Service
apiVersion: v1
kind: Service
metadata:
  name: lightning-service
  namespace: blncs-production
spec:
  selector:
    app: lightning
  type: ClusterIP
  ports:
  - name: p2p
    port: 9735
    targetPort: 9735
  - name: rpc
    port: 10009
    targetPort: 10009
  - name: rest
    port: 8080
    targetPort: 8080

---
# BLNCS Service
apiVersion: v1
kind: Service
metadata:
  name: blncs-service
  namespace: blncs-production
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:region:account:certificate/id"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"
spec:
  selector:
    app: blncs
    tier: backend
  type: LoadBalancer
  ports:
  - name: https
    port: 443
    targetPort: 8000
    protocol: TCP
  - name: grpc
    port: 50051
    targetPort: 50051
    protocol: TCP

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: blncs-hpa
  namespace: blncs-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: blncs-app
  minReplicas: 5
  maxReplicas: 50
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: "1000"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 5
        periodSeconds: 30
      selectPolicy: Max

---
# Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: blncs-service-account
  namespace: blncs-production

---
# Role
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: blncs-role
  namespace: blncs-production
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets"]
  verbs: ["get", "list", "watch"]

---
# RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: blncs-rolebinding
  namespace: blncs-production
subjects:
- kind: ServiceAccount
  name: blncs-service-account
  namespace: blncs-production
roleRef:
  kind: Role
  name: blncs-role
  apiGroup: rbac.authorization.k8s.io

---
# Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: blncs-network-policy
  namespace: blncs-production
spec:
  podSelector:
    matchLabels:
      app: blncs
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: blncs-production
    - podSelector:
        matchLabels:
          app: nginx-ingress
    ports:
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 50051
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - podSelector:
        matchLabels:
          app: lightning
    ports:
    - protocol: TCP
      port: 10009
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53

---
# PodDisruptionBudget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: blncs-pdb
  namespace: blncs-production
spec:
  minAvailable: 3
  selector:
    matchLabels:
      app: blncs
      tier: backend

---
# Monitoring - Prometheus ServiceMonitor
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: blncs-metrics
  namespace: blncs-production
spec:
  selector:
    matchLabels:
      app: blncs
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics