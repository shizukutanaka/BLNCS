apiVersion: v1
kind: Namespace
metadata:
  name: blncs
  labels:
    name: blncs
    app.kubernetes.io/name: blncs
    app.kubernetes.io/component: lightning-network
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: blncs-quota
  namespace: blncs
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    persistentvolumeclaims: "10"
    services: "10"
    secrets: "20"
    configmaps: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: blncs-limits
  namespace: blncs
spec:
  limits:
  - default:
      cpu: "1"
      memory: "2Gi"
    defaultRequest:
      cpu: "100m"
      memory: "256Mi"
    type: Container
  - default:
      storage: "10Gi"
    type: PersistentVolumeClaim