apiVersion: v1
kind: Secret
metadata:
  name: blncs-secrets
  namespace: blncs
  labels:
    app.kubernetes.io/name: blncs
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Database credentials
  DB_PASSWORD: "your-secure-database-password"
  DATABASE_URL: "postgresql://blncs:your-secure-database-password@postgresql-service:5432/blncs"
  
  # JWT and encryption keys
  JWT_SECRET_KEY: "your-super-secret-jwt-key-change-this-in-production"
  ENCRYPTION_KEY: "your-32-character-encryption-key!"
  
  # Lightning Network credentials
  LND_MACAROON_PATH: "/lnd/data/admin.macaroon"
  LND_TLS_CERT_PATH: "/lnd/tls.cert"
  LND_GRPC_HOST: "lnd-service:10009"
  
  # Redis credentials (for caching/sessions)
  REDIS_URL: "redis://redis-service:6379/0"
  REDIS_PASSWORD: "your-redis-password"
  
  # Monitoring and observability
  JAEGER_AGENT_HOST: "jaeger-agent"
  JAEGER_AGENT_PORT: "6831"
  PROMETHEUS_PUSHGATEWAY_URL: "http://prometheus-pushgateway:9091"

---
apiVersion: v1
kind: Secret
metadata:
  name: lnd-credentials
  namespace: blncs
  labels:
    app.kubernetes.io/name: blncs
    app.kubernetes.io/component: lightning
type: Opaque
data:
  # Base64 encoded LND macaroon and TLS cert
  # These should be replaced with actual values from your LND node
  admin.macaroon: ""  # Base64 encoded admin macaroon
  tls.cert: ""        # Base64 encoded TLS certificate
  
---
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-credentials
  namespace: blncs
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: database
type: Opaque
stringData:
  POSTGRES_USER: "blncs"
  POSTGRES_PASSWORD: "your-secure-database-password"
  POSTGRES_DB: "blncs"
  
---
apiVersion: v1
kind: Secret
metadata:
  name: registry-credentials
  namespace: blncs
  labels:
    app.kubernetes.io/name: blncs
    app.kubernetes.io/component: registry
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: "" # Base64 encoded Docker registry credentials if needed