<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BLNCS Dashboard</title>
    
    <!-- Styles -->
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: var(--font-family);
        }
        
        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 0;
            width: 100%;
            max-width: 400px;
            overflow: hidden;
        }
        
        .login-header {
            background: var(--primary-color);
            color: white;
            text-align: center;
            padding: 2rem;
        }
        
        .login-header .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        
        .login-header .subtitle {
            opacity: 0.9;
            font-size: 0.9rem;
        }
        
        .login-form {
            padding: 2rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group:last-child {
            margin-bottom: 0;
        }
        
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--dark-color);
        }
        
        .form-control {
            width: 100%;
            padding: 0.875rem;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s, box-shadow 0.3s;
            box-sizing: border-box;
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0,102,204,0.15);
        }
        
        .input-group {
            position: relative;
        }
        
        .input-group .form-control {
            padding-right: 3rem;
        }
        
        .input-group-append {
            position: absolute;
            right: 0;
            top: 0;
            height: 100%;
            display: flex;
            align-items: center;
            padding-right: 1rem;
        }
        
        .toggle-password {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--secondary-color);
            padding: 0;
        }
        
        .toggle-password:hover {
            color: var(--primary-color);
        }
        
        .btn-login {
            width: 100%;
            padding: 0.875rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .btn-login:hover {
            background: #0056b3;
        }
        
        .btn-login:active {
            transform: translateY(1px);
        }
        
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-login .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        .btn-login.loading .spinner {
            display: block;
        }
        
        .btn-login.loading .btn-text {
            display: none;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .alert {
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1.5rem;
            border: 1px solid transparent;
        }
        
        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border-color: #f5c6cb;
        }
        
        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border-color: #c3e6cb;
        }
        
        .help-text {
            font-size: 0.875rem;
            color: var(--secondary-color);
            margin-top: 0.5rem;
        }
        
        .login-footer {
            background: #f8f9fa;
            padding: 1.5rem 2rem;
            text-align: center;
            border-top: 1px solid #e9ecef;
        }
        
        .login-footer p {
            margin: 0;
            font-size: 0.875rem;
            color: var(--secondary-color);
        }
        
        .login-footer a {
            color: var(--primary-color);
            text-decoration: none;
        }
        
        .login-footer a:hover {
            text-decoration: underline;
        }
        
        /* Responsive */
        @media (max-width: 480px) {
            .login-container {
                margin: 1rem;
                max-width: none;
            }
            
            .login-header,
            .login-form,
            .login-footer {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="brand">
                <i class="fas fa-bolt"></i>
                BLNCS
            </div>
            <div class="subtitle">Bitcoin Lightning Network Control System</div>
        </div>
        
        <div class="login-form">
            <div id="alert-container"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="apiKey" class="form-label">API Key</label>
                    <div class="input-group">
                        <input 
                            type="password" 
                            id="apiKey" 
                            class="form-control" 
                            placeholder="Enter your API key"
                            required
                            autocomplete="current-password"
                        >
                        <div class="input-group-append">
                            <button type="button" class="toggle-password" id="togglePassword">
                                <i class="fas fa-eye" id="passwordIcon"></i>
                            </button>
                        </div>
                    </div>
                    <div class="help-text">
                        Your API key is required to access the dashboard. Contact your administrator if you need a new key.
                    </div>
                </div>
                
                <div class="form-group">
                    <button type="submit" class="btn-login" id="loginButton">
                        <div class="spinner"></div>
                        <span class="btn-text">
                            <i class="fas fa-sign-in-alt"></i>
                            Sign In
                        </span>
                    </button>
                </div>
            </form>
        </div>
        
        <div class="login-footer">
            <p>
                Need help? Check the 
                <a href="/api/v1/docs/swagger" target="_blank">API Documentation</a>
                or contact your system administrator.
            </p>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('loginForm');
            const apiKeyInput = document.getElementById('apiKey');
            const loginButton = document.getElementById('loginButton');
            const togglePassword = document.getElementById('togglePassword');
            const passwordIcon = document.getElementById('passwordIcon');
            const alertContainer = document.getElementById('alert-container');
            
            // Focus on API key input
            apiKeyInput.focus();
            
            // Toggle password visibility
            togglePassword.addEventListener('click', function() {
                const type = apiKeyInput.type === 'password' ? 'text' : 'password';
                apiKeyInput.type = type;
                
                if (type === 'password') {
                    passwordIcon.className = 'fas fa-eye';
                } else {
                    passwordIcon.className = 'fas fa-eye-slash';
                }
            });
            
            // Handle form submission
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const apiKey = apiKeyInput.value.trim();
                
                if (!apiKey) {
                    showAlert('error', 'Please enter your API key');
                    return;
                }
                
                // Show loading state
                loginButton.classList.add('loading');
                loginButton.disabled = true;
                clearAlerts();
                
                // Attempt login
                fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        api_key: apiKey
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        showAlert('success', 'Login successful! Redirecting...');
                        setTimeout(() => {
                            window.location.href = data.redirect || '/';
                        }, 1000);
                    } else {
                        showAlert('error', data.error || 'Login failed');
                        loginButton.classList.remove('loading');
                        loginButton.disabled = false;
                        apiKeyInput.focus();
                    }
                })
                .catch(error => {
                    console.error('Login error:', error);
                    showAlert('error', 'Connection failed. Please try again.');
                    loginButton.classList.remove('loading');
                    loginButton.disabled = false;
                    apiKeyInput.focus();
                });
            });
            
            // Handle Enter key in API key input
            apiKeyInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !loginButton.disabled) {
                    form.dispatchEvent(new Event('submit'));
                }
            });
            
            function showAlert(type, message) {
                clearAlerts();
                
                const alert = document.createElement('div');
                alert.className = `alert alert-${type === 'error' ? 'danger' : type}`;
                alert.innerHTML = `
                    <div class="alert-content">
                        <i class="fas fa-${type === 'error' ? 'exclamation-triangle' : 'check-circle'}"></i>
                        ${message}
                    </div>
                `;
                
                alertContainer.appendChild(alert);
                
                // Auto-remove success alerts after 3 seconds
                if (type === 'success') {
                    setTimeout(() => {
                        if (alert.parentElement) {
                            alert.remove();
                        }
                    }, 3000);
                }
            }
            
            function clearAlerts() {
                alertContainer.innerHTML = '';
            }
            
            // Check if already authenticated
            checkAuthStatus();
            
            function checkAuthStatus() {
                fetch('/api/dashboard/status')
                    .then(response => {
                        if (response.ok) {
                            // Already authenticated, redirect
                            window.location.href = '/';
                        }
                    })
                    .catch(() => {
                        // Not authenticated, stay on login page
                    });
            }
        });
    </script>
</body>
</html>
