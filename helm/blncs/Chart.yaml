apiVersion: v2
name: blncs
description: Bitcoin Lightning Network Channel System - Enterprise-grade Lightning Network management platform
type: application
version: 1.0.0
appVersion: "1.0.0"
home: https://blncs.org
sources:
  - https://blncs.org
maintainers:
  - name: BLNCS Team
    email: team@blncs.org
icon: https://blncs.org/logo.png
keywords:
  - bitcoin
  - lightning-network
  - payment-channels
  - cryptocurrency
  - fintech

dependencies:
  - name: postgresql
    version: 12.x.x
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
    tags:
      - database

  - name: redis
    version: 17.x.x
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
    tags:
      - cache

  - name: prometheus
    version: 15.x.x
    repository: https://prometheus-community.github.io/helm-charts
    condition: monitoring.prometheus.enabled
    tags:
      - monitoring

  - name: grafana
    version: 6.x.x
    repository: https://grafana.github.io/helm-charts
    condition: monitoring.grafana.enabled
    tags:
      - monitoring

  - name: elasticsearch
    version: 7.x.x
    repository: https://helm.elastic.co
    condition: logging.elasticsearch.enabled
    tags:
      - logging

annotations:
  category: Blockchain
  licenses: MIT