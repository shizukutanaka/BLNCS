# Alertmanager configuration for BLNCS
global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'blncs@localhost'
  smtp_auth_username: 'blncs@localhost'
  smtp_auth_password: 'password'
  smtp_require_tls: true

# Templates for notifications
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Route tree for alerts
route:
  group_by: ['alertname', 'severity', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  
  routes:
    # Critical alerts - immediate notification via multiple channels
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      repeat_interval: 1h
      routes:
        # Lightning network critical alerts
        - match:
            service: lightning
          receiver: 'lightning-critical'
          continue: true
        # Application down alerts
        - match:
            alertname: ApplicationDown
          receiver: 'application-down'
          continue: true
    
    # High severity alerts
    - match:
        severity: high
      receiver: 'high-alerts'
      group_wait: 30s
      repeat_interval: 2h
      
    # Medium severity alerts
    - match:
        severity: medium
      receiver: 'medium-alerts'
      group_wait: 2m
      repeat_interval: 6h
      
    # Low severity and info alerts
    - match:
        severity: low
      receiver: 'low-alerts'
      repeat_interval: 24h
      
    - match:
        severity: info
      receiver: 'info-alerts'
      repeat_interval: 24h
      
    # Security alerts - special handling
    - match:
        service: security
      receiver: 'security-alerts'
      group_wait: 10s
      repeat_interval: 30m
      
    # System alerts
    - match:
        service: system
      receiver: 'system-alerts'
      
    # Business logic alerts
    - match:
        service: business
      receiver: 'business-alerts'
      repeat_interval: 12h

# Inhibition rules - suppress alerts when other alerts are firing
inhibit_rules:
  # Suppress low severity alerts when critical alerts are firing for the same service
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'medium'
    equal: ['service', 'instance']
    
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'low'
    equal: ['service', 'instance']
    
  # Suppress medium alerts when high alerts are firing
  - source_match:
      severity: 'high'
    target_match:
      severity: 'medium'
    equal: ['service', 'instance']
    
  # Suppress specific alert combinations
  - source_match:
      alertname: 'ApplicationDown'
    target_match_re:
      alertname: '(HighCPUUsage|HighMemoryUsage|SlowHTTPResponses)'
    equal: ['instance']

# Notification receivers
receivers:
  # Default receiver
  - name: 'default'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#blncs-alerts'
        username: 'BLNCS Alertmanager'
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
        title: '{{ .GroupLabels.alertname }} - {{ .Status | toUpper }}'
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          *Instance:* {{ .Labels.instance }}
          {{ end }}
        send_resolved: true
        
  # Critical alerts - multiple channels
  - name: 'critical-alerts'
    email_configs:
      - to: 'ops-team@company.com'
        subject: '[CRITICAL] BLNCS Alert: {{ .GroupLabels.alertname }}'
        body: |
          Critical alert fired in BLNCS system!
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Service: {{ .Labels.service }}
          Instance: {{ .Labels.instance }}
          Started: {{ .StartsAt }}
          {{ if .Annotations.runbook }}Runbook: {{ .Annotations.runbook }}{{ end }}
          {{ end }}
          
          Please investigate immediately.
        html: |
          <h2>🚨 CRITICAL BLNCS Alert</h2>
          {{ range .Alerts }}
          <h3>{{ .Annotations.summary }}</h3>
          <p><strong>Description:</strong> {{ .Annotations.description }}</p>
          <p><strong>Severity:</strong> <span style="color: red;">{{ .Labels.severity }}</span></p>
          <p><strong>Service:</strong> {{ .Labels.service }}</p>
          <p><strong>Instance:</strong> {{ .Labels.instance }}</p>
          <p><strong>Started:</strong> {{ .StartsAt }}</p>
          {{ if .Annotations.runbook }}<p><strong>Runbook:</strong> <a href="{{ .Annotations.runbook }}">{{ .Annotations.runbook }}</a></p>{{ end }}
          {{ end }}
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#blncs-critical'
        username: 'BLNCS Critical Alerts'
        color: 'danger'
        title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Service:* {{ .Labels.service }}
          *Instance:* {{ .Labels.instance }}
          {{ if .Annotations.runbook }}*Runbook:* {{ .Annotations.runbook }}{{ end }}
          {{ end }}
        send_resolved: true
    pagerduty_configs:
      - routing_key: 'YOUR_PAGERDUTY_INTEGRATION_KEY'
        description: '{{ .GroupLabels.alertname }}: {{ .Alerts.Firing | len }} firing'
        severity: 'critical'
        details:
          firing: '{{ .Alerts.Firing | len }}'
          resolved: '{{ .Alerts.Resolved | len }}'
          service: '{{ .GroupLabels.service }}'
          
  # Lightning network critical alerts
  - name: 'lightning-critical'
    email_configs:
      - to: 'lightning-team@company.com'
        subject: '[LIGHTNING CRITICAL] {{ .GroupLabels.alertname }}'
        body: |
          Critical Lightning Network alert!
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Node: {{ .Labels.node_id }}
          {{ end }}
    webhook_configs:
      - url: 'http://lightning-webhook-handler:8080/alerts'
        send_resolved: true
        
  # Application down alerts
  - name: 'application-down'
    email_configs:
      - to: 'ops-team@company.com'
        subject: '[APPLICATION DOWN] BLNCS Service Unavailable'
        body: |
          BLNCS application is down!
          
          {{ range .Alerts }}
          Instance: {{ .Labels.instance }}
          Started: {{ .StartsAt }}
          {{ end }}
          
          Immediate action required!
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#blncs-critical'
        username: 'BLNCS Service Monitor'
        color: 'danger'
        title: '🔥 APPLICATION DOWN'
        text: 'BLNCS application is down on {{ .Labels.instance }}. Immediate investigation required!'
        
  # High severity alerts
  - name: 'high-alerts'
    email_configs:
      - to: 'ops-team@company.com'
        subject: '[HIGH] BLNCS Alert: {{ .GroupLabels.alertname }}'
        body: |
          High severity alert in BLNCS:
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Service: {{ .Labels.service }}
          Instance: {{ .Labels.instance }}
          {{ end }}
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#blncs-alerts'
        username: 'BLNCS Alerts'
        color: 'warning'
        title: '⚠️ HIGH: {{ .GroupLabels.alertname }}'
        
  # Medium severity alerts
  - name: 'medium-alerts'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#blncs-alerts'
        username: 'BLNCS Alerts'
        color: '#FFA500'
        title: '⚡ MEDIUM: {{ .GroupLabels.alertname }}'
        
  # Low severity alerts
  - name: 'low-alerts'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#blncs-monitoring'
        username: 'BLNCS Monitoring'
        color: 'good'
        title: 'ℹ️ LOW: {{ .GroupLabels.alertname }}'
        
  # Info alerts
  - name: 'info-alerts'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#blncs-monitoring'
        username: 'BLNCS Info'
        color: 'good'
        title: '💡 INFO: {{ .GroupLabels.alertname }}'
        
  # Security alerts
  - name: 'security-alerts'
    email_configs:
      - to: 'security-team@company.com'
        subject: '[SECURITY] BLNCS Security Alert: {{ .GroupLabels.alertname }}'
        body: |
          Security alert in BLNCS system:
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Component: {{ .Labels.component }}
          Instance: {{ .Labels.instance }}
          Time: {{ .StartsAt }}
          {{ end }}
          
          Please investigate potential security threat.
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#blncs-security'
        username: 'BLNCS Security'
        color: 'danger'
        title: '🛡️ SECURITY: {{ .GroupLabels.alertname }}'
        
  # System alerts
  - name: 'system-alerts'
    email_configs:
      - to: 'sysadmin@company.com'
        subject: '[SYSTEM] BLNCS System Alert: {{ .GroupLabels.alertname }}'
        body: |
          System alert in BLNCS infrastructure:
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Instance: {{ .Labels.instance }}
          {{ if .Annotations.runbook }}Runbook: {{ .Annotations.runbook }}{{ end }}
          {{ end }}
        
  # Business logic alerts
  - name: 'business-alerts'
    email_configs:
      - to: 'business-team@company.com'
        subject: '[BUSINESS] BLNCS Business Alert: {{ .GroupLabels.alertname }}'
        body: |
          Business logic alert in BLNCS:
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          {{ end }}
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#blncs-business'
        username: 'BLNCS Business Alerts'
        color: '#FF6600'
        title: '📊 BUSINESS: {{ .GroupLabels.alertname }}'

# Time intervals for muting alerts
time_intervals:
  - name: 'maintenance-window'
    time_intervals:
      - times:
          - start_time: '02:00'
            end_time: '04:00'
        weekdays: ['sunday']
        
  - name: 'business-hours'
    time_intervals:
      - times:
          - start_time: '09:00'
            end_time: '17:00'
        weekdays: ['monday:friday']