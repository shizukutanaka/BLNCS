version: '3.8'

services:
  blncs-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: blncs-production
    restart: unless-stopped
    ports:
      - "8000:8000"  # API port
      - "8080:8080"  # Web interface port
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - blncs_data:/app/data
      - ./secure_keys:/app/secure_keys:ro
    environment:
      - BLNCS_ENV=production
      - BLNCS_LOG_LEVEL=INFO
      - BLNCS_SECURITY_MODE=strict
      - BLNCS_MONITORING=enabled
      - PYTHONUNBUFFERED=1
    networks:
      - blncs-network
    depends_on:
      - redis
      - postgres
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.blncs.rule=Host(`blncs.example.com`)"
      - "traefik.http.routers.blncs.tls=true"

  postgres:
    image: postgres:15-alpine
    container_name: blncs-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=blncs_production
      - POSTGRES_USER=blncs_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - blncs-network
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blncs_user -d blncs_production"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  redis:
    image: redis:7-alpine
    container_name: blncs-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - blncs-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.3'

  nginx:
    image: nginx:alpine
    container_name: blncs-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    networks:
      - blncs-network
    depends_on:
      - blncs-app
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: blncs-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=90d'
      - '--web.enable-lifecycle'
    networks:
      - blncs-network

  grafana:
    image: grafana/grafana:latest
    container_name: blncs-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD_FILE=/run/secrets/grafana_password
      - GF_SECURITY_ADMIN_USER=admin
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    secrets:
      - grafana_password
    networks:
      - blncs-network
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:latest
    container_name: blncs-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - blncs-network

  promtail:
    image: grafana/promtail:latest
    container_name: blncs-promtail
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs:ro
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
    networks:
      - blncs-network
    depends_on:
      - loki

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: blncs-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Jaeger collector
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - blncs-network

  backup:
    image: postgres:15-alpine
    container_name: blncs-backup
    restart: "no"
    volumes:
      - postgres_data:/var/lib/postgresql/data:ro
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    environment:
      - POSTGRES_USER=blncs_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    networks:
      - blncs-network
    secrets:
      - postgres_password
    profiles:
      - backup
    command: ["sh", "/backup.sh"]

  watchtower:
    image: containrrr/watchtower
    container_name: blncs-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=86400  # 24 hours
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_STOPPED=true
    command: --schedule "0 0 3 * * *"  # Daily at 3 AM

networks:
  blncs-network:
    driver: bridge
    name: blncs-production-network
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16

volumes:
  blncs_data:
    driver: local
    name: blncs_production_data
  postgres_data:
    driver: local
    name: blncs_postgres_data
  redis_data:
    driver: local
    name: blncs_redis_data
  prometheus_data:
    driver: local
    name: blncs_prometheus_data
  grafana_data:
    driver: local
    name: blncs_grafana_data
  loki_data:
    driver: local
    name: blncs_loki_data

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  grafana_password:
    file: ./secrets/grafana_password.txt